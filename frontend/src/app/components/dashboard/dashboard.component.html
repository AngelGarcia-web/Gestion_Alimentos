<div class="dashboard-container">
  <h2>Panel de Control e Indicadores</h2>

  <div *ngIf="cargando" class="loading">
    <p>Cargando datos del panel...</p>
  </div>

  <div *ngIf="mensajeError" class="alert-error">
    {{ mensajeError }}
  </div>

  <div *ngIf="!cargando && !mensajeError" class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Alimentos Publicados</div>
      <div class="kpi-value">{{ stats.alimentosPublicados }}</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">Solicitudes Registradas</div>
      <div class="kpi-value">{{ stats.solicitudesTotales }}</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">Entregas Completadas</div>
      <div class="kpi-value">{{ stats.donacionesCompletadas }}</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-title">Usuarios en la Red</div>
      <div class="kpi-value">{{ stats.usuariosRegistrados }}</div>
    </div>
  </div>
</div>
