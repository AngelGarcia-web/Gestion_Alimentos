<div class="perfil-container">
  <h2>Mi Perfil de Institución</h2>

  <!-- Sección Avatar con Carga de Archivo -->
  <div class="avatar-section">
    <div class="avatar-circle">
      <img *ngIf="usuario.foto_url" [src]="usuario.foto_url" alt="Foto de Perfil" class="avatar-img" />
      <span *ngIf="!usuario.foto_url" class="avatar-initial">
        {{ usuario.nombre_institucion ? usuario.nombre_institucion.charAt(0).toUpperCase() : 'A' }}
      </span>
    </div>

    <div class="avatar-actions">
      <h3>{{ usuario.nombre_institucion || 'Usuario' }}</h3>
      <p class="role-badge">Institución Benéfica</p>
      
      <!-- Input oculto y botón para subir imagen -->
      <input type="file" #fileInput (change)="onFotoSeleccionada($event)" accept="image/*" style="display: none" />
      <button type="button" class="btn-change-photo" (click)="fileInput.click()">
        Seleccionar foto
      </button>
    </div>
  </div>

  <div *ngIf="mensajeExito" class="alert-success">{{ mensajeExito }}</div>
  <div *ngIf="mensajeError" class="alert-error">{{ mensajeError }}</div>

  <form (ngSubmit)="guardarPerfil()" class="perfil-form">
    <div class="form-group">
      <label>Nombre Institución</label>
      <input type="text" [(ngModel)]="usuario.nombre_institucion" name="nombre_institucion" required />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" [(ngModel)]="usuario.telefono" name="telefono" />
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input type="text" [(ngModel)]="usuario.direccion" name="direccion" />
    </div>

    <button type="submit" class="btn-submit">Guardar Cambios</button>
  </form>
</div>
